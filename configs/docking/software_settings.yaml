methods:
  diffdock:
    executable: software/DiffDock/
    singularity: software/DiffDock/diffdock_singularity.sif
    profile: gpu

  gnina:
    executable: software/gnina/gnina
    singularity: software/gnina/gnina_singularity.sif
    profile: gpu

  smina:
    executable: software/smina/smina
    profile: cpu

# Add any Slurm options required by your cluster. Values are passed through as SBATCH
# directives; set flag-only options to true. See software/README.md.
profiles:
  cpu:
    cpus-per-task: 8
    mem: 8G
    time: "48:00:00" 
    partition: 

  gpu:
    cpus-per-task: 8
    mem: 8G
    time: "48:00:00"
    gres: gpu:1  
    partition: 
